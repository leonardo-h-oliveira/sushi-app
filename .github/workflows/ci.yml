name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: PostgreSQL acceptance and restore
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sushi_release_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql://postgres:isolated-ci-password@localhost:5432/sushi_release_test
      TEST_POSTGRES_URL: postgresql://postgres:isolated-ci-password@localhost:5432/sushi_release_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - name: Validate migrations, seed and complete order workflow
        run: python -m pytest backend/tests/test_postgres_acceptance.py -v
      - name: Dump and restore into a separate test database
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" pg_dump -U postgres -d sushi_release_test -Fc --no-owner --no-acl > "$RUNNER_TEMP/sushi-test.dump"
          docker exec "$POSTGRES_CONTAINER" createdb -U postgres sushi_restore_test
          docker exec -i "$POSTGRES_CONTAINER" pg_restore -U postgres -d sushi_restore_test --no-owner --no-acl --exit-on-error < "$RUNNER_TEMP/sushi-test.dump"
          test "$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -d sushi_restore_test -tAc 'SELECT COUNT(*) FROM orders')" = "1"
          test "$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -d sushi_restore_test -tAc 'SELECT COUNT(*) FROM admin_users')" = "1"
      - name: Validate migration rollback and reapply
        run: |
          python -m alembic -c backend/alembic.ini downgrade base
          python -m alembic -c backend/alembic.ini upgrade head
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Run backend tests
        run: python -m pytest

  frontend:
    name: Frontend tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Run frontend tests
        run: pnpm test
      - name: Run ESLint
        run: pnpm lint
      - name: Build production frontend
        run: pnpm build

  e2e:
    name: Critical end-to-end flow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install backend dependencies
        run: pip install -r ../backend/requirements-dev.txt
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run critical workflow
        run: pnpm e2e
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
